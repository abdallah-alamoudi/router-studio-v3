name: Feature request
description: Suggest a user-focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user problem or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Possible solution
      description: Describe a solution, if you have one. Alternatives are welcome.
    validations:
      required: false
  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility considerations
      description: Could this change configuration, contact a provider, or incur charges?
    validations:
      required: false
