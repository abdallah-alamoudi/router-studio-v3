name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.401
      - name: Run Node.js tests
        run: npm test
      - name: Restore locked .NET dependencies
        run: dotnet restore RouterStudio.slnx --locked-mode
      - name: Build WPF desktop
        run: dotnet build src/RouterStudio.Desktop/RouterStudio.Desktop.csproj --configuration Release --no-restore
      - name: Run .NET Core unit tests
        run: dotnet test tests/RouterStudio.Core.Tests/RouterStudio.Core.Tests.csproj --configuration Release --no-restore
